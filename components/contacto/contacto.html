<div id="whatsappWidget" class="whatsapp-widget">
    <div id="whatsappBubble" class="whatsapp-bubble" role="status" aria-live="polite">
        <button id="whatsappBubbleClose" class="whatsapp-bubble-close" type="button"
            aria-label="Cerrar mensaje">&times;</button>

        <p class="whatsapp-bubble-title">
            ¿Tienes algún diseño en mente?
        </p>

        <p class="whatsapp-bubble-text">
            Escríbenos y lo hacemos realidad.
        </p>

        <a id="whatsappBubbleLink" class="whatsapp-bubble-link" href="#" target="_blank" rel="noopener noreferrer">
            Contactar por WhatsApp
        </a>
    </div>

    <a id="whatsappFloatButton" class="whatsapp-float-button" href="#" target="_blank" rel="noopener noreferrer"
        aria-label="Escríbenos por WhatsApp">
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
    </a>
</div>
