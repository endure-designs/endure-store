<!-- SHOPPING CART SIDE DRAWER -->
<div class="cart-drawer" id="cartDrawer">

    <div class="cart-overlay" id="cartOverlay"></div>

    <div class="cart-content">

        <!-- HEADER -->
        <div class="cart-header">

            <h3>Tu carrito</h3>

            <button type="button" class="cart-close" id="cartClose" aria-label="Cerrar carrito">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- ITEMS -->
        <div class="cart-items" id="cartItemsContainer">

            <!-- Los productos serán generados por JS -->

            <div class="cart-empty-state">

                <i class="fa-solid fa-bag-shopping"></i>

                <p>Tu carrito está vacío.</p>

                <a href="#productos" class="btn btn-primary btn-sm" id="emptyCartAction">
                    Ver catálogo
                </a>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="cart-footer">

            <div class="cart-totals">

                <span>Subtotal:</span>

                <span id="cartSubtotal">
                    S/0.00
                </span>

            </div>

            <p class="cart-note">
                * El envío y métodos de pago se coordinarán por WhatsApp.
            </p>

            <button type="button" class="btn btn-primary btn-block" id="checkoutBtn">
                <i class="fa-solid fa-lock"></i>
                Procesar Pago
            </button>

        </div>

    </div>

</div>
